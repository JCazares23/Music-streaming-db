services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - ./tests.sql:/tests.sql:ro
      - datos:/var/lib/postgresql

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  producer:
    build: .
    command: ["/app/.venv/bin/python", "app_simulator/producer.py"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      INTERVAL_SECONDS: ${INTERVAL_SECONDS}
      SKIP_RATE: ${SKIP_RATE}
      DUPLICATE_RATE: ${DUPLICATE_RATE}
      MAX_DUPLICATE_DELAY_SECONDS: ${MAX_DUPLICATE_DELAY_SECONDS}
      MAX_PLAY_AGE_DAYS: ${MAX_PLAY_AGE_DAYS}
    volumes:
      - logs:/app/logs
    depends_on: [postgres, kafka]
    restart: on-failure

  consumer:
    build: .
    command: ["/app/.venv/bin/python", "ingestion/consumer.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
    volumes:
      - crudo:/app/data
      - logs:/app/logs
    depends_on: [kafka]
    restart: on-failure

  processor:
    build: .
    command: ["sh", "-c", "printenv | grep -E '^(POSTGRES|KAFKA)_' > /etc/environment && cron -f"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
    volumes:
      - crudo:/app/data
      - logs:/app/logs
    depends_on: [postgres]

volumes:
  datos:
  crudo:
  logs:
